name: CI — Tests & Security

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        env:
          GEMINI_API_KEY: test-key-ci
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: npm test

  security:
    name: Security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Scan for hardcoded secrets
        # Fail if any real-looking key patterns are found outside of .env.example
        # and test fixture files.
        run: |
          echo "Scanning for potential hardcoded secrets..."
          FOUND=0

          # Patterns: API key assignments with non-placeholder values
          if grep -rn \
               --include="*.js" --include="*.ts" --include="*.json" \
               --exclude-dir=node_modules --exclude-dir=__tests__ \
               -E "(GEMINI_API_KEY|DATABASE_URL|API_KEY)\s*[=:]\s*['\"][^'\"]{10,}['\"]" \
               . 2>/dev/null | \
             grep -v "\.env\.example" | \
             grep -v "your_.*_here" | \
             grep -v "postgresql://test" | \
             grep -v "test-key"; then
            echo "::error::Potential hardcoded secret found — rotate keys and use env vars."
            FOUND=1
          fi

          # Check .env is not tracked
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is committed — remove it immediately and rotate all keys."
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "No hardcoded secrets detected."

      - name: Verify .env.example exists
        run: |
          if [ ! -f ".env.example" ]; then
            echo "::error::.env.example is missing — add it so contributors know which vars to set."
            exit 1
          fi
          echo ".env.example present."
